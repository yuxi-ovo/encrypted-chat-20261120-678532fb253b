<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; img-src data: blob:; media-src blob:; frame-src 'self' blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>私密聊天记录</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:'PingFang SC',sans-serif;background:#f2f3f2;color:#242b25;display:grid;place-items:center}.card{background:#fff;border:1px solid #e1e6df;border-radius:14px;padding:36px;width:min(410px,calc(100% - 36px));box-shadow:0 14px 50px #203b2510}.icon{font-size:27px;color:#08a94b}h1{font-size:22px;font-weight:500;margin:16px 0 12px}p{font-size:13px;color:#879084;line-height:1.8}label{font-size:12px;display:block;margin:27px 0 9px}input{width:100%;padding:12px 13px;border:1px solid #d6ded3;border-radius:6px;font-size:15px}button{width:100%;border:0;border-radius:6px;padding:12px;background:#07a74b;color:white;font:14px 'PingFang SC',sans-serif;margin-top:14px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{min-height:40px;font-size:12px;color:#72806b;margin-top:16px;line-height:1.8}.fine{font-size:10px;color:#a7ada2;margin-top:18px;line-height:1.8}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f3f3}[hidden]{display:none!important}</style></head><body><main class="card" id="gate"><div class="icon" aria-hidden="true">▣</div><h1>私密聊天记录</h1><p>输入访问密码，在当前浏览器中解锁聊天记录。</p><form id="unlock"><label for="password">访问密码</label><input id="password" type="password" autocomplete="off" required autofocus><button id="submit" type="submit">解锁查看</button></form><div class="status" id="status" role="status" aria-live="polite"></div><div class="fine">密码不会发送到服务器。<br>聊天内容在浏览器中解密，关闭页面后需重新解锁。</div></main><iframe id="viewer" title="聊天记录" sandbox="allow-scripts allow-same-origin allow-downloads allow-modals" referrerpolicy="no-referrer" hidden></iframe><script>
const SETTINGS={"salt": "Weaczm9/+nsH3kd1JiLKtQ==", "iterations": 600000};
const status=document.getElementById('status');const button=document.getElementById('submit');
const toBytes=text=>Uint8Array.from(atob(text),c=>c.charCodeAt(0));
let key,manifest,viewer,assetURLs=new Map();
async function readPart(path){const response=await fetch(path,{cache:'no-store',credentials:'omit'});if(!response.ok)throw Error('fetch');const encrypted=new Uint8Array(await response.arrayBuffer());return crypto.subtle.decrypt({name:'AES-GCM',iv:encrypted.slice(0,12)},key,encrypted.slice(12));}
async function loadAsset(file){if(assetURLs.has(file.path))return assetURLs.get(file.path);const parts=[];for(const part of file.parts)parts.push(await readPart(part));const url=URL.createObjectURL(new Blob(parts,{type:file.mime}));assetURLs.set(file.path,url);return url;}
document.getElementById('unlock').addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;status.textContent='正在解锁…';try{if(!crypto.subtle)throw Error('secure_context');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:toBytes(SETTINGS.salt),iterations:SETTINGS.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);manifest=JSON.parse(new TextDecoder().decode(await readPart('archive.bin')));const files=manifest.files.filter(f=>!f.lazy);let done=0;for(let i=0;i<files.length;i+=4){await Promise.all(files.slice(i,i+4).map(async file=>{await loadAsset(file);done++;status.textContent=`正在准备聊天内容 ${done} / ${files.length}…`;}));}const doc=new DOMParser().parseFromString(manifest.html,'text/html');for(const node of doc.querySelectorAll('[src],[poster],[href]')){for(const attribute of ['src','poster','href']){const path=node.getAttribute(attribute);if(!path?.startsWith('assets/'))continue;const file=manifest.files.find(f=>f.path===path);if(!file)throw Error('asset_missing');if(file.lazy){node.setAttribute('data-encrypted-asset',path);node.setAttribute(attribute,'#');}else{node.setAttribute(attribute,assetURLs.get(path));}}}viewer=document.getElementById('viewer');viewer.addEventListener('load',()=>{const inner=viewer.contentDocument;for(const link of inner.querySelectorAll('[data-encrypted-asset]'))link.addEventListener('click',async e=>{e.preventDefault();if(link.dataset.loading)return;link.dataset.loading='1';const text=link.textContent;link.textContent='正在解密原视频…';try{const file=manifest.files.find(f=>f.path===link.dataset.encryptedAsset);const url=await loadAsset(file);const save=inner.createElement('a');save.href=url;save.download=file.path.split('/').pop();save.click();}catch(error){link.textContent='下载失败，点击重试';}finally{delete link.dataset.loading;if(link.textContent!=='下载失败，点击重试')link.textContent=text;}});},{once:true});viewer.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;document.getElementById('password').value='';document.getElementById('gate').hidden=true;viewer.hidden=false;}catch(error){status.textContent=error.name==='OperationError'?'密码不正确，请重试。':'暂时无法解锁，请确认网络连接，并使用 HTTPS 地址。';button.disabled=false;}});
</script></body></html>
